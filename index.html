<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biểu đồ Chứng khoán VN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      padding: 10px 14px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      flex-wrap: wrap;
      align-items: center;
    }
    input, select, button {
      padding: 7px 11px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      font-size: 14px;
    }
    input { width: 90px; text-transform: uppercase; }
    button {
      background: #238636;
      border-color: #238636;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #2ea043; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-left: auto; font-size: 13px; color: #8b949e; }
    #chart {
      flex: 1;
      width: 100%;
      height: calc(100vh - 55px);
    }
    .error { color: #f85149 !important; }
  </style>
</head>

    <input type="text" id="symbol" value="VCB" />
    <label>Khung:</label>
